name: Build fallback Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata for Docker
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            azthebest/gridwise-bup-2026
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save Docker fallback image
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker save ghcr.io/${{ github.repository }}:latest | gzip -1 > gridwise-bup-2026-docker-image.tar.gz
      - name: Split Docker fallback image for downloadable artifacts
        run: split -b 50M -d -a 2 gridwise-bup-2026-docker-image.tar.gz gridwise-docker.part-
      - name: Upload Docker image part 00
        uses: actions/upload-artifact@v4
        with:
          name: gridwise-docker-part-00
          path: gridwise-docker.part-00
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Docker image part 01
        uses: actions/upload-artifact@v4
        with:
          name: gridwise-docker-part-01
          path: gridwise-docker.part-01
