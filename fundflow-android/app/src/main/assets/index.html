<script>/* FundFlow's ledger. All values in integer poisha (1 BDT = 100 poisha).

(function(root, factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;root.FFLedger=api;})(typeof globalThis==='object'?globalThis:this,function(){

 const ledger=(db,excludeId)=>{
   const byPair={},rev={gross:0,refunds:0,cogs:0,operating:0,inventory:0,draws:0,parentSupport:0,personal:0,personalParent:0,personalBusiness:0,transfers:0},entries=[], errors=[];
   const active=(db.transactions||[]).filter(t=>!t.deleted&&t.id!==excludeId).slice().sort((a,b)=>(a.seq||0)-(b.seq||0));
   const get=(w,s)=>byPair[key(w,s)]||0;
   const post=(w,s,delta,tx)=>{const k=key(w,s);byPair[k]=(byPair[k]||0)+delta;if(byPair[k]<0)errors.push({tx:tx.id,key:k,missing:-byPair[k],wallet:w,source:s});};
   for(const t of active){const a=Number(t.amount); if(a<=0){errors.push({tx:t.id,invalid:true});continue;}
     if(t.type==='support'){post(t.wallet,t.source||'parents',a,t);if((t.source||'parents')==='parents')rev.parentSupport+=a;}
     else if(t.type==='sale'){post(t.wallet,'business',a,t);rev.gross+=a;}
     else if(t.type==='expense'){post(t.wallet,t.source,-a,t);rev.personal+=a;if(t.source==='business'){rev.draws+=a;rev.personalBusiness+=a;} if(t.source==='parents')rev.personalParent+=a;}
     else if(t.type==='cost'){post(t.wallet,'business',-a,t); if(t.costKind==='cogs')rev.cogs+=a;else if(t.costKind==='inventory')rev.inventory+=a;else rev.operating+=a;}
     else if(t.type==='transfer'){post(t.wallet,t.source,-a,t);post(t.toWallet,t.source,a,t);rev.transfers+=a;if(t.fee>0){post(t.wallet,t.source,-t.fee,t);if(t.source==='business')rev.operating+=t.fee;else{rev.personal+=t.fee;if(t.source==='parents')rev.personalParent+=t.fee;}}}
     else if(t.type==='reallocate'){post(t.wallet,t.source,-a,t);post(t.wallet,t.toSource,a,t);if(t.source==='business'&&t.toSource!=='business')rev.draws+=a;}
     else if(t.type==='adjustment'){post(t.wallet,t.source,a*(t.direction==='out'?-1:1),t);}
     else if(t.type==='refund'){if(t.refundKind==='sale'){post(t.wallet,'business',-a,t);rev.refunds+=a;}else{post(t.wallet,t.source,a,t);if(t.refundKind==='cost'){if(t.costKind==='cogs')rev.cogs-=a;else if(t.costKind==='inventory')rev.inventory-=a;else rev.operating-=a;}else{rev.personal-=a;if(t.source==='business'){rev.draws-=a;rev.personalBusiness-=a;} if(t.source==='parents')rev.personalParent-=a;}}}
     entries.push(t);
   }
   const wallets={},sources={};let total=0;for(const [k,v] of Object.entries(byPair)){const [w,s]=k.split('|');wallets[w]=(wallets[w]||0)+v;sources[s]=(sources[s]||0)+v;total+=v;}
   const netRevenue=rev.gross-rev.refunds, grossProfit=netRevenue-rev.cogs,profit=grossProfit-rev.operating;
   return {byPair,wallets,sources,total,rev,netRevenue,grossProfit,profit,margin:netRevenue?profit/netRevenue:0,entries,errors};
 };

 const add=(db,tx)=>{const row={...tx,id:tx.id||'tx_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),seq:nextSeq(db),createdAt:new Date().toISOString()};const clone={...db,transactions:[...db.transactions,row]};const out=ledger(clone);if(out.errors.length)throw Error('Insufficient funds or invalid amount in wallet/source');return clone;};

});

const txicon={support:'↙',sale:'↗',expense:'−',cost:'▥',transfer:'⇄',reallocate:'⇆',adjustment:'±',refund:'↩'};
function state(){return F.ledger(db)}function current(){return db.transactions.filter(x=>!x.deleted).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.seq||0)-(a.seq||0));}
function balance(w,s){return state().byPair[F.key(w,s)]||0;}
function periodRows(){return F.filter(current(),{period});}
function report(rows){const x={support:0,revenue:0,expense:0,cost:0,cogs:0,operating:0,inventory:0,draws:0,personalParent:0,personalBusiness:0,refund:0,byCategory:{}};rows.forEach(z=>{let a=z.amount;if(z.type==='support'&&z.source==='parents')x.support+=a;if(z.type==='sale')x.revenue+=a;if(z.type==='expense'){x.expense+=a;x.byCategory[z.category||'misc']=(x.byCategory[z.category||'misc']||0)+a;if(z.source==='business'){x.draws+=a;x.personalBusiness+=a;}if(z.source==='parents')x.personalParent+=a;}if(z.type==='cost'){x.cost+=a;if(z.costKind==='cogs')x.cogs+=a;else if(z.costKind==='inventory')x.inventory+=a;else x.operating+=a;}if(z.type==='reallocate'&&z.source==='business'&&z.toSource!=='business')x.draws+=a;if(z.type==='transfer'&&z.fee){if(z.source==='business'){x.cost+=z.fee;x.operating+=z.fee;}else x.expense+=z.fee;}if(z.type==='refund'){if(z.refundKind==='sale'){x.revenue-=a;}else if(z.refundKind==='cost'){x.cost-=a;if(z.costKind==='cogs')x.cogs-=a;else if(z.costKind==='inventory')x.inventory-=a;else x.operating-=a;}else {x.expense-=a;x.byCategory[z.category||'misc']=(x.byCategory[z.category||'misc']||0)-a;if(z.source==='parents')x.personalParent-=a;else if(z.source==='business'){x.personalBusiness-=a;x.draws-=a;}}}});x.profit=x.revenue-x.cogs-x.operating;return x;}
function opts(items,selected='',labelFn=x=>x.name){return items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(labelFn(x))}</option>`).join('');}
function sel(id,list,value='',cls='sel'){return `<select id="${id}" class="${cls}">${list.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`;}
function periodSelect(){return sel('period', [['today',t('today')],['week',t('week')],['month',t('month')],['year',t('year')],['all',t('all')]],period,'sel date-filter');}
function stat(label,n,icon='◉',color=''){return `<div class="stat ${color}"><div class="stat-icon">${icon}</div><label>${esc(label)}</label><strong>${fmt(n)}</strong></div>`;}
function title(name,sub=''){return `<div class="topline"><div><h1>${esc(name)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</div><button class="iconbtn" data-go="settings">⚙</button></div>`;}
function empty(msg=t('noRecords')){return `<div class="empty"><div class="empty-icon">◌</div>${esc(msg)}</div>`;}
function txName(z){if(z.note)return z.note;if(z.merchant)return z.merchant;if(z.type==='expense'||z.type==='cost')return cname(z.category||'misc');return t(z.type);}
function txItem(z){let plus=['support','sale','refund'].includes(z.type)||(z.type==='adjustment'&&z.direction!=='out');return `<div class="tx-row" data-tx="${esc(z.id)}"><div class="tx-icon">${txicon[z.type]||'•'}</div><div class="tx-info"><strong>${esc(txName(z))}</strong><small>${esc(t(z.type))} · ${esc(walletName(z.wallet))} · ${esc(z.date||'')}</small></div><div class="tx-money ${plus?'pos':'neg'}">${plus?'+':'−'}${fmt(z.amount)}</div></div>`;}
function statSection(r,s){return `<div class="section-head"><h2>${t('overview')}</h2><span class="smallpill">${t(period==='all'?'allTime':period==='month'?'thisMonth':period)}</span></div><div class="grid2">${stat(t('parentsLeft'),s.sources.parents||0,'♡')}${stat(t('businessLeft'),s.sources.business||0,'◈')}${stat(t('received'),r.support,'↙')}${stat(t('businessRevenue'),r.revenue,'↗')}${stat(t('netProfit'),r.profit,'▥','green')}${stat(t('spent'),r.expense+r.cost,'↗','red')}</div>`;}
function sourceChips(){return `<div class="chips" id="sourceChips">${[['',t('allFunds')],...db.sources.map(s=>[s.id,sourceName(s.id)])].map(([id,label])=>`<button class="chip ${id===sourceFilter?'active':''}" data-source-filter="${esc(id)}">${esc(label)}</button>`).join('')}</div>`;}
function walletRows(s,focus=''){let wallets=db.wallets.filter(w=>w.active!==false||((s.wallets[w.id]||0)!==0));if(focus)wallets=wallets.filter(w=>w.id===focus);return wallets.map(w=>{let total=sourceFilter?(s.byPair[F.key(w.id,sourceFilter)]||0):(s.wallets[w.id]||0);const piece=db.sources.filter(z=>(s.byPair[F.key(w.id,z.id)]||0)!==0).map(z=>`${sourceName(z.id)} ${fmt(s.byPair[F.key(w.id,z.id)])}`).join(' · ');return `<div class="wallet-card" data-wallet="${esc(w.id)}"><div class="wallet-icon">${sy[w.id]||'◉'}</div><div class="wallet-info"><strong>${esc(walletName(w.id))}</strong><small>${esc(piece||t('balance')+' 0')}</small></div><div class="wallet-balance">${fmt(total)}<small>${t('balance')}</small></div></div>`;}).join('');}
function home(){const s=state(),r=report(periodRows()),total=sourceFilter?(s.sources[sourceFilter]||0):s.total;return `<div class="hero"><div class="kicker">${t('total')}</div><div class="big">${fmt(total)}</div><div class="hero-foot"><span>${t('reconcile')} · ${db.wallets.length} ${t('wallets').toLowerCase()}</span><button data-open="expense">+ ${t('expense')}</button></div></div>${sourceChips()}<div class="filter-row" style="justify-content:flex-end">${periodSelect()}</div>${statSection(r,s)}<div class="section"><div class="section-head"><h2>${t('yourWallets')}</h2><button class="link" data-go="wallets">${t('seeAll')}</button></div><div class="card">${walletRows(s)||empty(t('noWallets'))}</div></div><div class="section"><div class="section-head"><h2>${t('quickActions')}</h2></div><div class="grid2"><button class="btn secondary" data-open="support">↙ ${t('parentSupport')}</button><button class="btn secondary" data-open="sale">↗ ${t('businessSale')}</button><button class="btn secondary" data-open="expense">− ${t('recordExpense')}</button><button class="btn secondary" data-open="transfer">⇄ ${t('walletTransfer')}</button></div></div><div class="section"><div class="section-head"><h2>${t('latest')}</h2><button class="link" data-go="activity">${t('viewAll')}</button></div><div class="card">${current().slice(0,5).map(txItem).join('')||empty()}</div></div><div class="section"><button class="btn secondary block" data-go="insights">▤ ${t('insights')} →</button></div>`;}
function activity(){const rows=F.filter(current(),{period,source:sourceFilter,q:query});return `${title(t('activity'),t('transactions'))}<div class="filter-row"><input id="search" class="search" placeholder="${t('search')}" value="${esc(query)}">${periodSelect()}</div>${sourceChips()}<div class="section-head"><h2>${rows.length} ${t('transactions')}</h2><button class="btn" data-open="expense">+ ${t('add')}</button></div><div class="card">${rows.map(txItem).join('')||empty(t('noResults'))}</div>`;}
function wallets(){const s=state();return `${title(t('wallets'),t('walletMix'))}<div class="hero"><div class="kicker">${t('total')}</div><div class="big">${fmt(sourceFilter?(s.sources[sourceFilter]||0):s.total)}</div><div class="hero-foot"><span>${t('reconcile')}</span><button data-manage="wallet">+ ${t('addWallet')}</button></div></div>${sourceChips()}<div class="section"><div class="card">${walletRows(s)||empty(t('noWallets'))}</div></div><div class="section"><button class="btn secondary block" data-manage="wallet">${t('manageWallets')}</button></div><div class="section"><div class="section-head"><h2>${t('breakdown')}</h2></div>${db.sources.map(z=>`<div class="card" style="margin-bottom:9px"><div class="splitline"><strong>${esc(sourceName(z.id))}</strong><strong>${fmt(s.sources[z.id]||0)}</strong></div>${db.wallets.filter(w=>(s.byPair[F.key(w.id,z.id)]||0)!==0).map(w=>`<div class="splitline"><small>${esc(walletName(w.id))}</small><small>${fmt(s.byPair[F.key(w.id,z.id)]||0)}</small></div>`).join('')}</div>`).join('')}</div>`;}
function walletDetail(id){const w=db.wallets.find(w=>w.id===id);if(!w){screen='wallets';return wallets();}const s=state(),rows=current().filter(z=>z.wallet===id||z.toWallet===id);return `<div class="topline"><button class="iconbtn" data-go="wallets">‹</button><h2>${esc(walletName(id))}</h2><button class="iconbtn" data-manage="wallet">✎</button></div><div class="hero"><div class="kicker">${t('walletBalance')}</div><div class="big">${fmt(s.wallets[id]||0)}</div><div class="hero-foot"><span>${t('reconcile')}</span><button data-open="transfer">⇄ ${t('transfer')}</button></div></div><div class="section"><h2 style="margin-bottom:12px">${t('breakdown')}</h2><div class="grid2">${db.sources.map(z=>stat(sourceName(z.id),s.byPair[F.key(id,z.id)]||0,'◈')).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('activity')}</h2><small class="muted">${rows.length}</small></div><div class="card">${rows.map(txItem).join('')||empty()}</div></div>`;}
function business(){const s=state(),r=report(periodRows());return `${title(t('business'),t('profitView'))}<div class="hero"><div class="kicker">${t('netProfit')}</div><div class="big">${fmt(r.profit)}</div><div class="hero-foot"><span>${t('profitMargin')}: ${r.revenue?(r.profit/r.revenue*100).toFixed(1):'0'}%</span><button data-open="sale">+ ${t('sale')}</button></div></div><div class="filter-row" style="justify-content:flex-end">${periodSelect()}</div><div class="section"><div class="grid2">${stat(t('grossRevenue'),r.revenue,'↗')}${stat(t('goodsCost'),r.cogs,'▤')}${stat(t('grossProfit'),r.revenue-r.cogs,'◈','green')}${stat(t('operatingCosts'),r.operating,'−')}${stat(t('inventoryPurchases'),r.inventory,'▣')}${stat(t('ownerDraw'),r.draws,'♡')}${stat(t('cashAvailable'),s.sources.business||0,'◉','green')}${stat(t('netProfit'),r.profit,'↗','green')}</div></div><div class="section"><div class="note-box">ⓘ ${t('performanceInfo')}</div></div><div class="section"><div class="section-head"><h2>${t('fromBusiness')} · ${t('wallets')}</h2></div><div class="card">${db.wallets.map(w=>`<div class="splitline"><small>${esc(walletName(w.id))}</small><strong>${fmt(s.byPair[F.key(w.id,'business')]||0)}</strong></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('transactions')}</h2></div><div class="card">${current().filter(z=>z.source==='business'||z.type==='sale'||z.type==='cost').slice(0,15).map(txItem).join('')||empty()}</div><div class="spacer"></div><button class="btn block" data-open="cost">+ ${t('cost')}</button></div>`;}
function categoryChart(data){const rows=Object.entries(data).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);const top=rows[0]?.[1]||1;return rows.map(([k,v])=>`<div class="category-track"><div class="row"><strong>${esc(cname(k))}</strong><span>${fmt(v)}</span></div><div class="progress"><span style="width:${Math.max(1,100*v/top)}%"></span></div></div>`).join('')||empty(t('noData'));}
function insights(){const r=report(periodRows()),s=state();const byMonth=Array.from({length:6},(_,i)=>{const dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()-(5-i));let m=dt.getMonth(),y=dt.getFullYear();return {label:dt.toLocaleDateString(db.settings.lang==='bn'?'bn-BD':'en-US',{month:'short'}),value:report(current().filter(z=>{let d=new Date(z.date);return d.getMonth()===m&&d.getFullYear()===y})).expense};});let max=Math.max(...byMonth.map(x=>x.value),1);return `${title(t('insights'),t('lifestyle'))}<div class="filter-row">${periodSelect()}</div><div class="report-grid">${stat(t('periodIncome'),r.revenue+r.support,'↙')}${stat(t('periodExpenses'),r.expense+r.cost,'−')}${stat(t('dateExpenses'),r.byCategory.dating||0,'♡')}${stat(t('luxuryExpenses'),r.byCategory.luxury||0,'✧')}${stat(t('hobbyExpenses'),r.byCategory.hobbies||0,'♫')}${stat(t('netProfit'),r.profit,'▥')}</div><div class="section"><div class="section-head"><h2>${t('monthlySpend')}</h2></div><div class="card"><div class="mini-chart">${byMonth.map(x=>`<div class="bar" style="height:${Math.max(2,100*x.value/max)}%" title="${fmt(x.value)}"></div>`).join('')}</div><div class="barlabels">${byMonth.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div></div></div><div class="section"><div class="section-head"><h2>${t('byCategory')}</h2></div><div class="card">${categoryChart(r.byCategory)}</div></div><div class="section"><div class="section-head"><h2>${t('walletMix')}</h2></div><div class="card">${db.wallets.map(w=>`<div class="splitline"><small>${esc(walletName(w.id))}</small><strong>${fmt(s.wallets[w.id]||0)}</strong></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>${t('breakdown')}</h2></div><div class="card"><div class="splitline"><span>${t('personalParent')}</span><strong>${fmt(r.personalParent)}</strong></div><div class="splitline"><span>${t('personalBusiness')}</span><strong>${fmt(r.personalBusiness)}</strong></div></div></div><div class="section"><div class="grid2"><button class="btn secondary" data-export="csv">${t('csv')}</button><button class="btn secondary" data-export="json">${t('backup')}</button></div></div>`;}
function settings(){return `${title(t('settings'),t('credits'))}<div class="card"><div class="settings-row"><div><strong>${t('language')}</strong><small>English / বাংলা</small></div>${sel('lang',[['en','English'],['bn','বাংলা']],db.settings.lang)}</div><div class="settings-row"><div><strong>${t('theme')}</strong><small>${t('toggle')}</small></div>${sel('theme',[['dark',t('dark')],['light',t('light')],['system',t('system')]],db.settings.theme)}</div><div class="settings-row"><div><strong>${t('manageWallets')}</strong><small>${db.wallets.length} ${t('wallets')}</small></div><button class="btn secondary" data-manage="wallet">${t('edit')}</button></div><div class="settings-row"><div><strong>${t('manageSources')}</strong><small>${db.sources.length} ${t('sourceLabel')}</small></div><button class="btn secondary" data-manage="source">${t('edit')}</button></div><div class="settings-row"><div><strong>${t('customCategory')}</strong></div><button class="btn secondary" data-manage="category">+ ${t('add')}</button></div><div class="settings-row"><div><strong>${t('pin')}</strong><small>${t('pinHint')}</small></div><button class="btn secondary" data-pin="set">${db.settings.pin?t('removePin'):t('setPin')}</button></div>${db.settings.pin?`<div class="settings-row"><strong>${t('lock')}</strong><button class="btn secondary" data-pin="lock">${t('lock')}</button></div>`:''}</div><div class="section"><div class="section-head"><h2>${t('download')}</h2></div><div class="grid2"><button class="btn secondary" data-export="json">${t('backup')}</button><button class="btn secondary" data-export="csv">${t('csv')}</button><button class="btn secondary" data-export="restore">${t('restore')}</button><button class="btn danger" data-export="wipe">${t('wipe')}</button></div></div><div class="section"><div class="note-box"><strong>${t('help')}</strong><br>${t('helpBody')}</div></div><div class="section"><div class="note-box">▣ ${t('privacy')}<br>${t('offline')}<br><br>${t('pinHint')}</div></div>`;}
function render(){document.documentElement.dataset.theme=db.settings.theme==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):db.settings.theme;document.documentElement.lang=db.settings.lang;document.getElementById('greeting').textContent=t('greeting');document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));const pg=document.getElementById('page');let html=screen==='home'?home():screen==='activity'?activity():screen==='wallets'?wallets():screen==='business'?business():screen==='insights'?insights():screen==='settings'?settings():screen.startsWith('wallet:')?walletDetail(screen.split(':')[1]):home();pg.innerHTML=html;document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===screen));}
function navigate(next){screen=next;query='';render();window.scrollTo(0,0);}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hide'),2600);}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hide');}
function closeModal(){document.getElementById('modal').classList.add('hide');editing=null;modalMode='';}
function field(label,content,wide=false){return `<label class="field ${wide?'wide':''}"><span>${label}</span>${content}</label>`;}
function txForm(orig){const d=orig||{};const activeWallets=db.wallets.filter(w=>w.active!==false||w.id===d.wallet||w.id===d.toWallet);const sources=db.sources.filter(s=>s.active!==false||s.id===d.source||s.id===d.toSource);const val=(id,defaultValue='')=>esc(d[id]??defaultValue);const walletOptions=opts(activeWallets,d.wallet||activeWallets[0]?.id,w=>walletName(w.id));const sourceOptions=opts(sources,d.source||((type==='sale'||type==='cost')?'business':'parents'),s=>sourceName(s.id));const rawCats=type==='cost'?CATS.business:CATS.personal;const cats=[...new Set([...rawCats,...(db.categories||[]),d.category].filter(Boolean))];const types=['support','sale','expense','cost','transfer','reallocate','adjustment','refund'];const date=(d.date||new Date().toISOString().slice(0,10));const amount=orig?String(F.money(d.amount)) : '';
 const typeSelect=`<div class="types">${types.map(k=>`<button type="button" data-type="${k}" class="${type===k?'active':''}">${t(k)}</button>`).join('')}</div>`;
 let body=`<form id="txform">${field(t('amount'),`<input id="famount" class="inp" type="number" step="0.01" min="0.01" inputmode="decimal" required value="${esc(amount)}" placeholder="0.00">`,true)}<div class="form-grid">`;
 if(!['sale','cost'].includes(type))body+=field(type==='support'?t('source'):t('paidFrom'),`<select id="fsource" class="sel">${sourceOptions}</select>`);
 body+=field(type==='support'||type==='sale'?t('receivedAt'):t('paidVia'),`<select id="fwallet" class="sel">${walletOptions}</select>`);
 if(type==='transfer')body+=field(t('toWallet'),`<select class="sel" id="ftowallet">${opts(activeWallets,d.toWallet||activeWallets.find(w=>w.id!==(d.wallet||activeWallets[0]?.id))?.id,w=>walletName(w.id))}</select>`);
 if(type==='reallocate')body+=field(t('toSource'),`<select class="sel" id="ftosource">${opts(sources,d.toSource||sources.find(x=>x.id!==(d.source||'parents'))?.id,s=>sourceName(s.id))}</select>`);
 if(type==='expense'||type==='cost'||type==='refund')body+=field(t('category'),`<select class="sel" id="fcategory">${opts(cats.map(id=>({id})),d.category||cats[0],x=>cname(x.id))}</select>`);
 if(type==='cost'||type==='refund')body+=field(t('costKind'),sel('fcostkind',[['operating',t('operating')],['cogs',t('cogs')],['inventory',t('inventory')]],d.costKind||'operating'));
 if(type==='refund')body+=field(t('refundTreatment'),sel('frefundkind',[['personal',t('personalRefund')],['cost',t('businessRefund')],['sale',t('saleReturn')]],d.refundKind||'personal'));
 if(type==='adjustment')body+=field(t('adjustDirection'),sel('fdirection',[['in',t('addFunds')],['out',t('subtractFunds')]],d.direction||'in'));
 if(type==='transfer')body+=field(t('fee'),`<input id="ffee" class="inp" type="number" step="0.01" min="0" value="${val('fee',0)?F.money(d.fee):'0'}">`);
 body+=field(t('date'),`<input class="inp" id="fdate" type="date" required value="${esc(date)}">`);
 body+=field(t('merchant'),`<input class="inp" id="fmerchant" value="${val('merchant')}" placeholder="${t('merchant')}">`);
 if(type==='expense')body+=field(t('event'),`<input class="inp" id="fevent" value="${val('event')}" placeholder="${t('event')}">`,true);
 body+=field(t('note'),`<textarea id="fnote" class="inp" placeholder="${t('note')}">${esc(d.note||'')}</textarea>`,true);body+='</div><div id="available" class="available"></div><button type="submit" class="btn block">'+(orig?t('update'):t('save'))+'</button></form>';
 return typeSelect+body;
}
function updateAvailable(){const w=document.getElementById('fwallet')?.value,s=document.getElementById('fsource')?.value||(['sale','cost'].includes(type)?'business':'parents');const el=document.getElementById('available');if(el&&w)el.textContent=t('available')+': '+fmt(balance(w,s));}
function openTx(kind='expense',id=''){editing=id||null;const old=id?db.transactions.find(z=>z.id===id):null;type=old?.type||kind;modalMode='tx';openModal(id?t('edit'):t('add'),txForm(old));updateAvailable();}
function formSave(){const get=id=>document.getElementById(id)?.value;let amt=F.amount(get('famount'));if(!Number.isSafeInteger(amt)||amt<=0){toast(t('invalid'));return;}const data={type,amount:amt,wallet:get('fwallet'),source:(type==='sale'||type==='cost'||(type==='refund'&&['cost','sale'].includes(get('frefundkind'))))?'business':get('fsource'),date:get('fdate'),note:get('fnote')||'',merchant:get('fmerchant')||'',toWallet:get('ftowallet')||undefined,toSource:get('ftosource')||undefined,category:get('fcategory')||undefined,costKind:get('fcostkind')||undefined,refundKind:get('frefundkind')||undefined,direction:get('fdirection')||undefined,event:get('fevent')||'',fee:F.amount(get('ffee')||0)};if(!data.wallet||!data.source||!data.date){toast(t('pleaseChoose'));return;}if(type==='transfer'&&data.wallet===data.toWallet){toast(t('sameWallet'));return;}if(type==='reallocate'&&data.source===data.toSource){toast(t('sameSource'));return;}
 try{const wasEditing=!!editing;let updated=editing?F.update(db,editing,data):F.add(db,data);closeModal();save(updated);toast(wasEditing?t('updated'):t('added'));}catch(e){toast(t('insufficient'));}}
function showTx(id){const z=db.transactions.find(z=>z.id===id);if(!z)return;editing=id;modalMode='detail';const pairs=[[t('amount'),fmt(z.amount)],[t('source'),sourceName(z.source||'business')],[t('wallet'),walletName(z.wallet)],[t('category'),z.category?cname(z.category):t(z.type)],[t('date'),z.date],[t('merchant'),z.merchant||'—'],[t('note'),z.note||'—'],[t('event'),z.event||'—']];if(z.toWallet)pairs.push([t('toWallet'),walletName(z.toWallet)]);if(z.toSource)pairs.push([t('toSource'),sourceName(z.toSource)]);if(z.costKind)pairs.push([t('costKind'),t(z.costKind)]);let html=`<div class="hero"><div class="kicker">${t(z.type)}</div><div class="big">${fmt(z.amount)}</div></div><div class="spacer"></div><div class="card">${pairs.map(([k,v])=>`<div class="detail"><span>${esc(k)}</span><strong class="over">${esc(v)}</strong></div>`).join('')}</div><div class="sheet-actions"><button class="btn secondary" data-edit="${esc(id)}">${t('edit')}</button><button class="btn danger" data-del="${esc(id)}">${t('delete')}</button></div>`;openModal(t('detail'),html);}
function manage(kind){modalMode='manage-'+kind;const items=kind==='wallet'?db.wallets:kind==='source'?db.sources:(db.categories||[]).map(id=>({id,name:id}));let html=`<div class="card">${items.map(it=>`<div class="settings-row"><div><strong>${esc(kind==='wallet'?walletName(it.id):kind==='source'?sourceName(it.id):cname(it.id))}</strong><small>${esc(it.id)}</small></div><button class="btn secondary" data-rename="${esc(kind)}:${esc(it.id)}">✎</button></div>`).join('')||empty()}</div><div class="spacer"></div><form id="manageForm">${field(t('name'),`<input id="manageName" class="inp" maxlength="60" required placeholder="${t('name')}">`)}<button class="btn block" type="submit">+ ${t(kind==='wallet'?'addWallet':kind==='source'?'addSource':'customCategory')}</button></form>`;openModal(t(kind==='wallet'?'manageWallets':kind==='source'?'manageSources':'customCategory'),html);}
function addManaged(){const kind=modalMode.split('-')[1];const name=document.getElementById('manageName').value.trim();if(!name)return;const id='custom_'+Math.random().toString(36).slice(2,9);const next=JSON.parse(JSON.stringify(db));if(kind==='wallet')next.wallets.push({id,name,active:true});if(kind==='source')next.sources.push({id,name,active:true});if(kind==='category')next.categories.push(id),next.settings['category_'+id]=name;closeModal();save(next);toast(t('added'));}
function rename(kind,id){const item=(kind==='wallet'?db.wallets:kind==='source'?db.sources:[]).find(x=>x.id===id);const name=kind==='category'?cname(id):(item?.name||'');modalMode='rename';openModal(t('name'),`<form id="renameForm" data-kind="${kind}" data-id="${esc(id)}">${field(t('name'),`<input class="inp" id="newname" value="${esc(name)}" required maxlength="60">`)}<button type="submit" class="btn block">${t('save')}</button></form>`);}
function showExport(kind){if(kind==='restore'){modalMode='restore';openModal(t('restore'),`<p class="sub">${t('restoreWarning')}</p><form id="restoreForm"><textarea id="restoreText" class="inp" rows="8" placeholder="${t('paste')}"></textarea><button class="btn block" type="submit">${t('import')}</button></form>`);return;}
 if(kind==='wipe'){modalMode='wipe';openModal(t('wipe'),`<p class="error">${t('wipeWarning')}</p><form id="wipeForm">${field(t('eraseText'),'<input class="inp" id="eraseCheck" required placeholder="DELETE">')}<button class="btn danger block" type="submit">${t('wipe')}</button></form>`);return;}
 let content='';if(kind==='json')content=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2);else{const header=['id','date','type','amount_BDT','source','wallet','to_wallet','to_source','category','cost_kind','merchant','event','notes'];const safe=v=>'"'+String(v??'').replace(/"/g,'""')+'"';content=header.join(',')+'\n'+current().map(z=>[z.id,z.date,z.type,F.money(z.amount),z.source,z.wallet,z.toWallet,z.toSource,z.category,z.costKind,z.merchant,z.event,z.note].map(safe).join(',')).join('\n');}
 modalMode='export';openModal(kind==='json'?t('backup'):t('csv'),`<p class="sub">${t('copyText')}</p><textarea class="inp" id="exportText" rows="12" readonly>${esc(content)}</textarea><div class="sheet-actions"><button class="btn block" data-copy="1">${t('copy')}</button></div>`);}
function setPin(){modalMode='pin';openModal(t('pin'),`<p class="sub">${t('pinHint')}</p><form id="pinForm">${field(t('pin'),'<input id="newpin" class="inp" type="number" inputmode="numeric" pattern="[0-9]*" min="0" maxlength="8" placeholder="4–8 digits">')}<button class="btn block">${db.settings.pin?t('removePin'):t('setPin')}</button></form>`);}
function lockScreen(){if(!db.settings.pin)return;const el=document.getElementById('lockOverlay');el.classList.remove('hide');el.innerHTML=`<div class="brandmark" style="width:72px;height:72px;font-size:33px">F<span>•</span></div><h1 style="margin-top:23px">${t('unlock')}</h1><input class="inp" id="unlockPin" inputmode="numeric" type="password" placeholder="••••"><button class="btn block" id="unlockBtn">${t('unlock')}</button><div class="hint">${t('pinHint')}</div>`;}
function unlock(){if(document.getElementById('unlockPin')?.value===db.settings.pin){document.getElementById('lockOverlay').classList.add('hide');document.getElementById('unlockPin').value='';}else toast(t('wrongPin'));}
document.addEventListener('click',e=>{let x=e.target.closest('[data-nav],[data-go],[data-close],[data-open],[data-source-filter],[data-tx],[data-wallet],[data-type],[data-edit],[data-del],[data-manage],[data-rename],[data-export],[data-copy],[data-pin]');if(!x)return;if(x.dataset.close){closeModal();return;}if(x.dataset.nav){if(x.dataset.nav==='add')openTx('expense');else navigate(x.dataset.nav);return;}if(x.dataset.go){navigate(x.dataset.go);return;}if(x.dataset.open){openTx(x.dataset.open);return;}if(x.hasAttribute('data-source-filter')){sourceFilter=x.dataset.sourceFilter;render();return;}if(x.dataset.tx){showTx(x.dataset.tx);return;}if(x.dataset.wallet){navigate('wallet:'+x.dataset.wallet);return;}if(x.dataset.type){type=x.dataset.type;document.getElementById('modalBody').innerHTML=txForm(editing?db.transactions.find(t=>t.id===editing):null);updateAvailable();return;}if(x.dataset.edit){openTx('expense',x.dataset.edit);return;}if(x.dataset.del){modalMode='delete';const id=x.dataset.del;openModal(t('delete'),`<p>${t('delete')} ${t('transactions')}?</p><div class="sheet-actions"><button class="btn secondary" data-close="1">${t('cancel')}</button><button class="btn danger" id="deleteConfirm" data-delete-confirm="${esc(id)}">${t('delete')}</button></div>`);return;}if(x.dataset.manage){manage(x.dataset.manage);return;}if(x.dataset.rename){const [kind,id]=x.dataset.rename.split(':');rename(kind,id);return;}if(x.dataset.export){showExport(x.dataset.export);return;}if(x.dataset.copy){const f=document.getElementById('exportText');f.focus();f.select();try{document.execCommand('copy');toast(t('copySuccess'));}catch(e){toast(t('copyText'));}return;}if(x.dataset.pin){if(x.dataset.pin==='lock')lockScreen();else setPin();return;}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-delete-confirm]');if(!b)return;try{save(F.remove(db,b.dataset.deleteConfirm));closeModal();toast(t('deleted'));}catch(err){toast(t('insufficient'));}});
document.getElementById('settingsQuick').addEventListener('click',()=>navigate('settings'));document.getElementById('themeQuick').addEventListener('click',()=>{const next=JSON.parse(JSON.stringify(db));next.settings.theme=db.settings.theme==='dark'?'light':'dark';save(next);});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='lang'||id==='theme'){const next=JSON.parse(JSON.stringify(db));next.settings[id]=e.target.value;save(next);}if(id==='period'){period=e.target.value;render();}if(['fwallet','fsource'].includes(id))updateAvailable();});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const focus= e.target.selectionStart;render();const el=document.getElementById('search');el?.focus();try{el.setSelectionRange(focus,focus)}catch(e){}}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target.id; if(form==='txform'){formSave();return;}if(form==='manageForm'){addManaged();return;}if(form==='renameForm'){const kind=e.target.dataset.kind,id=e.target.dataset.id,name=document.getElementById('newname').value.trim();if(!name)return;const next=JSON.parse(JSON.stringify(db));if(kind==='category')next.settings['category_'+id]=name;else{const item=(kind==='wallet'?next.wallets:next.sources).find(x=>x.id===id);if(item)item.name=name;}closeModal();save(next);toast(t('updated'));return;}if(form==='restoreForm'){try{const obj=JSON.parse(document.getElementById('restoreText').value);if(!Array.isArray(obj.transactions)||!Array.isArray(obj.wallets)||!Array.isArray(obj.sources)||F.ledger(obj).errors.length)throw Error('invalid');closeModal();save(obj);toast(t('added'));}catch(err){toast(t('invalidBackup'));}return;}if(form==='wipeForm'){if(document.getElementById('eraseCheck').value!=='DELETE'){toast(t('eraseText'));return;}closeModal();save(F.defaults());navigate('home');return;}if(form==='pinForm'){const next=JSON.parse(JSON.stringify(db));if(next.settings.pin)next.settings.pin='';else{let p=document.getElementById('newpin').value;if(!/^\d{4,8}$/.test(p)){toast('PIN: 4–8 digits');return;}next.settings.pin=p;}closeModal();save(next);toast(t('added'));return;}});
document.getElementById('lockOverlay').addEventListener('click',e=>{if(e.target.id==='unlockBtn')unlock();});document.getElementById('lockOverlay').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
render();lockScreen();
})();
</script></body></html>
